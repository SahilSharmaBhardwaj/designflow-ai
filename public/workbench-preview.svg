  <text x="840" y="140" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Click node to inspect</text>

  <!-- Node 1 (Selected) -->
  <rect x="24" y="154" width="180" height="88" rx="10" fill="#16161a" stroke="#14b8a6" stroke-width="1.5"/>
  <rect x="36" y="166" width="20" height="20" rx="10" fill="#14b8a6"/>
  <text x="43" y="180" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="800">1</text>
  <text x="64" y="180" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">Intent & Entry</text>
  <text x="36" y="206" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">Reviews bond yield & stats</text>
  <text x="36" y="222" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9">UI: Dashboard Widget</text>

  <!-- Node 2 -->
  <rect x="216" y="154" width="180" height="88" rx="10" fill="#111114" stroke="#27272a" stroke-width="1"/>
  <rect x="228" y="166" width="20" height="20" rx="10" fill="#27272a"/>
  <text x="235" y="180" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="800">2</text>
  <text x="256" y="180" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600">YTM Calculation</text>
  <text x="228" y="206" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">Configures investment qty</text>
  <text x="228" y="222" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9">UI: Live Cashflow Table</text>

  <!-- Node 3 (Branch Point) -->
  <rect x="408" y="154" width="180" height="88" rx="10" fill="#111114" stroke="#27272a" stroke-width="1"/>
  <rect x="420" y="166" width="20" height="20" rx="10" fill="#27272a"/>
  <text x="427" y="180" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="800">3</text>
  <text x="448" y="180" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600">Quote Lock & 2FA</text>
  <text x="420" y="206" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">60s lock + SEBI notice</text>
  <rect x="520" y="166" width="56" height="18" rx="4" fill="#38290f" stroke="#b45309" stroke-width="1"/>
  <text x="528" y="179" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" font-weight="700">Branch</text>

  <!-- Node 4 -->
  <rect x="600" y="154" width="180" height="88" rx="10" fill="#111114" stroke="#27272a" stroke-width="1"/>
  <rect x="612" y="166" width="20" height="20" rx="10" fill="#27272a"/>
  <text x="619" y="180" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="800">4</text>
  <text x="640" y="180" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600">Execution State</text>
  <text x="612" y="206" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">Optimistic settlement</text>
  <text x="612" y="222" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9">UI: Stepper Indicator</text>

  <!-- Node 5 -->
  <rect x="792" y="154" width="184" height="88" rx="10" fill="#111114" stroke="#27272a" stroke-width="1"/>
  <rect x="804" y="166" width="20" height="20" rx="10" fill="#27272a"/>
  <text x="811" y="180" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="800">5</text>
  <text x="832" y="180" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600">Confirmation</text>
  <text x="804" y="206" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">PDF receipt generated</text>
  <text x="804" y="222" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9">UI: Success Banner</text>

  <!-- Detailed Step Inspector Card -->
  <rect x="24" y="260" width="952" height="276" rx="12" fill="#111114" stroke="#27272a" stroke-width="1"/>
  <rect x="24" y="260" width="4" height="276" rx="2" fill="#14b8a6"/>

  <text x="44" y="292" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">Step 1: Entry &amp; Intent Discovery</text>
  <text x="320" y="292" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600">[Persona: Retail Indian Investor]</text>
  
  <rect x="840" y="276" width="120" height="26" rx="6" fill="#16161a" stroke="#27272a" stroke-width="1"/>
  <text x="860" y="293" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600">Edit Step Details</text>

  <!-- Action Box -->
  <rect x="44" y="316" width="440" height="130" rx="8" fill="#16161a" stroke="#232328" stroke-width="1"/>
  <text x="60" y="340" fill="#14b8a6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">USER ACTION &amp; PSYCHOLOGY</text>
  <text x="60" y="364" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Navigates to the Bond Trading screen and explores high-yield bonds.</text>
  <text x="60" y="388" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Emotional State: Curious, seeking yield comparisons vs Fixed Deposits.</text>
  <text x="60" y="416" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">Touchpoint: Primary Card CTA ("Invest Now")</text>

  <!-- Response Box -->
  <rect x="500" y="316" width="460" height="130" rx="8" fill="#16161a" stroke="#232328" stroke-width="1"/>
  <text x="516" y="340" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">SYSTEM RESPONSE &amp; HEURISTIC VERIFICATION</text>
  <text x="516" y="364" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Renders itemized yield breakdown, issuer rating badge (AAA), and SEBI tags.</text>
  <text x="516" y="388" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Heuristic #1: System status transparency with live price update indicators.</text>
  <text x="516" y="416" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">WCAG 2.2: 4.8:1 contrast achieved on all helper text</text>

  <!-- Bottom Bar with Edge Case -->
  <rect x="44" y="460" width="916" height="56" rx="6" fill="#1b1712" stroke="#451a03" stroke-width="1"/>
  <text x="60" y="484" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">EDGE CASE RECOVERY STRATEGY</text>
  <text x="60" y="502" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">If bond quote expires during verification, system pauses countdown and presents instant 1-click rate refresh without losing entered inputs.</text>
</svg>
