<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-10" y="-10" width="1020" height="580" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="560" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="559" rx="15.5" stroke="#27272a" stroke-width="1"/>

  <!-- Top App Window Bar -->
  <rect x="0" y="0" width="1000" height="48" rx="16" fill="#0d0d11"/>
  <circle cx="28" cy="24" r="6" fill="#f43f5e" opacity="0.8"/>
  <circle cx="46" cy="24" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="64" cy="24" r="6" fill="#10b981" opacity="0.8"/>

  <!-- App Title & Badges in Top Bar -->
  <text x="96" y="28" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">DesignFlow AI</text>
  <text x="190" y="28" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">/ project / BondsPe — Secondary Bond Trading Flow</text>

  <rect x="800" y="14" width="80" height="22" rx="6" fill="#132e2b" stroke="#115e59" stroke-width="1"/>
  <text x="814" y="29" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="600">Mock AI</text>

  <rect x="890" y="14" width="90" height="22" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="902" y="29" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="600">Export Specs</text>

  <!-- Tab Navigation Bar -->
  <rect x="24" y="68" width="952" height="42" rx="8" fill="#111114" stroke="#232328" stroke-width="1"/>
  
  <!-- Active Tab: User Flow -->
  <rect x="30" y="74" width="120" height="30" rx="6" fill="#18181b" stroke="#14b8a6" stroke-width="1"/>
  <text x="50" y="93" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600">1. User Flow</text>
  <circle cx="42" cy="90" r="3" fill="#14b8a6"/>

  <!-- Other Tabs -->
  <text x="180" y="93" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">2. UX Audit</text>
  <text x="290" y="93" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">3. User Stories</text>
  <text x="420" y="93" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">4. Research Guide</text>
  <text x="570" y="93" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">5. Usability Testing</text>
  <text x="730" y="93" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">6. Design Brief</text>

